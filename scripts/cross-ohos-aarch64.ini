# Meson cross file for OHOS arm64 — TEMPLATE.
# build-libaegisub-ohos.sh 会把占位符替换成实际路径，生成 build/ 下的副本；
# 不要直接编辑生成出来的文件。
[binaries]
c = '@OHOS_NDK@/llvm/bin/aarch64-unknown-linux-ohos-clang'
cpp = '@OHOS_NDK@/llvm/bin/aarch64-unknown-linux-ohos-clang++'
ar = '@OHOS_NDK@/llvm/bin/llvm-ar'
strip = '@OHOS_NDK@/llvm/bin/llvm-strip'
pkgconfig = '/usr/bin/pkg-config'
cmake = '@OHOS_NDK@/build-tools/cmake/bin/cmake'

[host_machine]
system = 'ohos'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
needs_exe_wrapper = true
pkg_config_libdir = '@WS@/build/deps/prefix/lib/pkgconfig'

[built-in options]
c_args = ['--target=aarch64-linux-ohos', '--sysroot=@OHOS_NDK@/sysroot', '-pthread', '-DBOOST_LOCALE_NO_POSIX_BACKEND', '-DBOOST_LOCALE_NO_WINAPI_BACKEND']
cpp_args = ['--target=aarch64-linux-ohos', '--sysroot=@OHOS_NDK@/sysroot', '-pthread', '-DBOOST_LOCALE_NO_POSIX_BACKEND', '-DBOOST_LOCALE_NO_WINAPI_BACKEND']
c_link_args = ['--target=aarch64-linux-ohos', '--sysroot=@OHOS_NDK@/sysroot', '-static', '-pthread']
cpp_link_args = ['--target=aarch64-linux-ohos', '--sysroot=@OHOS_NDK@/sysroot', '-static', '-pthread']
