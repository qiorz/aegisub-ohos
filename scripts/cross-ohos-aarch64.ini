[binaries]
c = '/opt/harmony26/command-line-tools/sdk/default/openharmony/native/llvm/bin/aarch64-unknown-linux-ohos-clang'
cpp = '/opt/harmony26/command-line-tools/sdk/default/openharmony/native/llvm/bin/aarch64-unknown-linux-ohos-clang++'
ar = '/opt/harmony26/command-line-tools/sdk/default/openharmony/native/llvm/bin/llvm-ar'
strip = '/opt/harmony26/command-line-tools/sdk/default/openharmony/native/llvm/bin/llvm-strip'
pkgconfig = '/usr/bin/pkg-config'
cmake = '/opt/harmony26/command-line-tools/sdk/default/openharmony/native/build-tools/cmake/bin/cmake'

[host_machine]
system = 'ohos'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
needs_exe_wrapper = true
pkg_config_libdir = '/root/opt/dsh/workspace-aegisub/build/deps/prefix/lib/pkgconfig'

[built-in options]
c_args = ['--target=aarch64-linux-ohos', '--sysroot=/opt/harmony26/command-line-tools/sdk/default/openharmony/native/sysroot', '-pthread', '-DBOOST_LOCALE_NO_POSIX_BACKEND', '-DBOOST_LOCALE_NO_WINAPI_BACKEND']
cpp_args = ['--target=aarch64-linux-ohos', '--sysroot=/opt/harmony26/command-line-tools/sdk/default/openharmony/native/sysroot', '-pthread', '-DBOOST_LOCALE_NO_POSIX_BACKEND', '-DBOOST_LOCALE_NO_WINAPI_BACKEND']
c_link_args = ['--target=aarch64-linux-ohos', '--sysroot=/opt/harmony26/command-line-tools/sdk/default/openharmony/native/sysroot', '-static', '-pthread']
cpp_link_args = ['--target=aarch64-linux-ohos', '--sysroot=/opt/harmony26/command-line-tools/sdk/default/openharmony/native/sysroot', '-static', '-pthread']
